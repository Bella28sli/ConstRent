stages:
  - lint
  - test
  - build
  - security

.default_python_job:
  tags:
    - docker
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"
    DJANGO_SECRET_KEY: "ci-secret-key"
    DJANGO_DEBUG: "False"
    DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
  cache:
    key: "pip-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip
  before_script:
    - |
      if ! command -v python3 >/dev/null 2>&1; then
        if command -v apk >/dev/null 2>&1; then
          apk add --no-cache python3 py3-pip
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update && apt-get install -y python3 python3-pip
        else
          echo "No supported package manager found to install python3"
          exit 1
        fi
      fi
    - python3 --version
    - python3 -m pip install --upgrade pip
    - python3 -m pip install -r rental_project/requirements.txt
    - mkdir -p artifacts

lint_syntax:
  stage: lint
  extends: .default_python_job
  script:
    - python3 -m pip install ruff
    - ruff check rental_project --select E9,F63,F7,F82 | tee artifacts/ruff-report.txt
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - artifacts/ruff-report.txt

test_smoke:
  stage: test
  extends: .default_python_job
  script:
    - cd rental_project
    - python3 manage.py check | tee ../artifacts/test-smoke.log
    - python3 -m compileall . | tee -a ../artifacts/test-smoke.log
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - artifacts/test-smoke.log

build_project:
  stage: build
  extends: .default_python_job
  script:
    - cd rental_project
    - python3 manage.py collectstatic --noinput
    - python3 manage.py spectacular --file ../artifacts/openapi.yaml
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - artifacts/openapi.yaml
      - rental_project/staticfiles

dependency_scanning:
  stage: security
  extends: .default_python_job
  script:
    - python3 -m pip install pip-audit
    - pip-audit -r rental_project/requirements.txt --format json > artifacts/pip-audit.json || true
  allow_failure: true
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - artifacts/pip-audit.json
